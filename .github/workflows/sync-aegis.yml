name: Sync Upstream Aegis Rules

on:
  schedule:
    - cron: '20 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Surge-Ruleset
        uses: actions/checkout@v4

      - name: Clone upstream Thoseyearsbrian/Aegis
        run: git clone --depth 1 https://github.com/Thoseyearsbrian/Aegis.git /tmp/aegis-upstream

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build and verify Surge + Clash rulesets
        run: python3 scripts/build_rules.py --upstream /tmp/aegis-upstream --out . --verify

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add surge clash manifest.json README.md
          if git diff --cached --quiet; then
            echo "No upstream rule changes."
            exit 0
          fi
          UP_SHA=$(git -C /tmp/aegis-upstream rev-parse --short HEAD)
          git commit -m "chore(rules): sync Thoseyearsbrian/Aegis@${UP_SHA} (Surge + Clash)"
          git push origin HEAD:main
